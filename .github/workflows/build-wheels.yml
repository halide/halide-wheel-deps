name: Build wheels

on:
  push:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Determine which packages need building
  # ---------------------------------------------------------------------------
  check:
    name: Check for existing wheels
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      flatbuffers_version: ${{ steps.check.outputs.flatbuffers_version }}
      wabt_version: ${{ steps.check.outputs.wabt_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check halide/pypi for existing releases
        id: check
        shell: python
        run: |
          import os, re, urllib.error, urllib.request

          def get_version(path):
              with open(path) as f:
                  content = f.read()
              return re.search(r'^version\s*=\s*"([^"]+)"', content, re.MULTILINE).group(1)

          def release_exists(tag):
              url = f"https://api.github.com/repos/halide/pypi/releases/tags/{tag}"
              try:
                  urllib.request.urlopen(url, timeout=30)
                  return True
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return False
                  raise

          fb_version = get_version("packages/flatbuffers/pyproject.toml")
          wabt_version = get_version("packages/wabt/pyproject.toml")

          fb_needed = not release_exists(f"halide-flatbuffers-{fb_version}")
          wabt_needed = not release_exists(f"halide-wabt-{wabt_version}")

          print(f"halide-flatbuffers {fb_version}: {'needed' if fb_needed else 'up to date'}")
          print(f"halide-wabt {wabt_version}: {'needed' if wabt_needed else 'up to date'}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"flatbuffers_needed={'true' if fb_needed else 'false'}\n")
              f.write(f"wabt_needed={'true' if wabt_needed else 'false'}\n")
              f.write(f"flatbuffers_version={fb_version}\n")
              f.write(f"wabt_version={wabt_version}\n")
              f.write(f"should_build={'true' if (fb_needed or wabt_needed) else 'false'}\n")

  # ---------------------------------------------------------------------------
  # Job 2: Build wheels for all packages and platforms
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.pkg }} / ${{ matrix.platform }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        pkg: [flatbuffers, wabt]
        platform:
          - x86-64-linux
          - x86-32-linux
          - arm-64-linux
          - arm-32-linux
          - x86-64-macos
          - arm-64-macos
          - x86-64-windows
          - x86-32-windows
        include:
          - platform: x86-64-linux
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            manylinux_plat: manylinux_2_28_x86_64

          # i686: Node.js 20 has no i686 binaries, so actions/checkout
          # cannot run inside the container. Run on the host and use
          # docker for the build/repair steps instead.
          - platform: x86-32-linux
            runner: ubuntu-latest
            docker_image: quay.io/pypa/manylinux_2_28_i686
            manylinux_plat: manylinux_2_28_i686
            pin_gcc12: true

          - platform: arm-64-linux
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            manylinux_plat: manylinux_2_28_aarch64

          # armv7l: same Node.js issue as i686 -- use docker run.
          - platform: arm-32-linux
            runner: ubuntu-24.04-arm
            docker_image: quay.io/pypa/manylinux_2_31_armv7l
            manylinux_plat: manylinux_2_31_armv7l

          - platform: x86-64-macos
            runner: macos-15-intel

          - platform: arm-64-macos
            runner: macos-15

          - platform: x86-64-windows
            runner: windows-latest
            msvc_arch: amd64

          - platform: x86-32-windows
            runner: windows-latest
            msvc_arch: amd64_x86
            wheel_plat: win32

    env:
      CMAKE_GENERATOR: Ninja
      MACOSX_DEPLOYMENT_TARGET: "11"

    steps:
      # ---- Checkout ----
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- Toolchain (manylinux containers) ----
      # Pin GCC 12 to avoid GCC 14 libstdc++ symbols leaking into the wheel.
      - name: Set up GCC 12 and Python (manylinux)
        if: matrix.container
        run: |
          yum install -y gcc-toolset-12-gcc-c++
          echo "/opt/rh/gcc-toolset-12/root/usr/bin" >> "$GITHUB_PATH"
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      # ---- Python (non-container, non-docker) ----
      - name: Set up Python
        if: ${{ !matrix.container && !matrix.docker_image }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- MSVC (Windows) ----
      - name: Set up MSVC
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # ---- Build tools (non-container, non-docker) ----
      - name: Install CMake and Ninja
        if: ${{ !matrix.container && !matrix.docker_image }}
        run: pip install cmake ninja

      # ---- Build wheel ----
      - name: Build wheel
        if: ${{ !matrix.docker_image }}
        run: pip wheel packages/${{ matrix.pkg }} -w dist/

      # ---- Build wheel (docker, for i686 and armv7l) ----
      - name: Build wheel (docker)
        if: matrix.docker_image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            -e PIN_GCC12=${{ matrix.pin_gcc12 && 'true' || 'false' }} \
            ${{ matrix.docker_image }} \
            bash -c '
              set -euo pipefail
              if [ "$PIN_GCC12" = "true" ]; then
                yum install -y gcc-toolset-12-gcc-c++
                export PATH="/opt/rh/gcc-toolset-12/root/usr/bin:$PATH"
              fi
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              pip install cmake ninja
              pip wheel packages/${{ matrix.pkg }} -w dist/
            '

      # ---- Retag wheel (scikit-build-core bug: x86 cross-compile gets win_amd64) ----
      - name: Retag wheel
        if: matrix.wheel_plat
        shell: bash
        run: |
          pip install wheel
          wheel tags --platform-tag ${{ matrix.wheel_plat }} --remove dist/*.whl

      # ---- Repair wheel (auditwheel, in container) ----
      # Use repair for wheels with ELF binaries; fall back to addtag for
      # static-lib/header-only wheels that produce no ELF files.
      - name: Repair wheel (auditwheel)
        if: ${{ matrix.manylinux_plat && !matrix.docker_image }}
        run: |
          pip install auditwheel
          OUT=$(auditwheel repair --plat ${{ matrix.manylinux_plat }} -w dist/ dist/*.whl 2>&1) || {
            echo "$OUT"
            echo "$OUT" | grep -q "does not look like a platform wheel" \
              && pip install wheel && wheel tags --platform-tag ${{ matrix.manylinux_plat }} --remove dist/*.whl \
              || exit 1
          }
          rm -f dist/*-linux_*.whl

      # ---- Repair wheel (auditwheel via docker, for i686 and armv7l) ----
      - name: Repair wheel (auditwheel/docker)
        if: ${{ matrix.manylinux_plat && matrix.docker_image }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            ${{ matrix.docker_image }} \
            bash -c '
              set -euo pipefail
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              pip install auditwheel
              OUT=$(auditwheel repair --plat ${{ matrix.manylinux_plat }} -w dist/ dist/*.whl 2>&1) || {
                echo "$OUT"
                echo "$OUT" | grep -q "does not look like a platform wheel" \
                  && pip install wheel && wheel tags --platform-tag ${{ matrix.manylinux_plat }} --remove dist/*.whl \
                  || exit 1
              }
              rm -f dist/*-linux_*.whl
            '

      # ---- Upload artifact ----
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.pkg }}-${{ matrix.platform }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # Job 3: Publish wheels as halide/pypi releases
  # ---------------------------------------------------------------------------
  upload:
    name: Publish to halide/pypi
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PYPI_RELEASES_TOKEN }}
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Publish releases
        run: |
          set -euo pipefail

          publish_project() {
            local tag="$1" glob="$2"
            shopt -s nullglob
            # shellcheck disable=SC2206  # intentional glob expansion, not word splitting
            local files=(dist/${glob})
            shopt -u nullglob
            if [ ${#files[@]} -eq 0 ]; then
              echo "no files matching '$glob', skipping $tag"
              return
            fi

            python3 -c '
          import hashlib, json, sys
          manifest = {f.split("/")[-1]: hashlib.sha256(open(f, "rb").read()).hexdigest() for f in sys.argv[1:]}
          json.dump(manifest, open("dist/manifest.json", "w"))
          ' "${files[@]}"

            if gh release view "$tag" --repo halide/pypi >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" dist/manifest.json --repo halide/pypi --clobber
            else
              gh release create "$tag" "${files[@]}" dist/manifest.json \
                --repo halide/pypi --title "$tag" --notes "Automated build from halide-wheel-deps"
            fi
            rm -f dist/manifest.json
          }

          publish_project "halide-flatbuffers-${{ needs.check.outputs.flatbuffers_version }}" "halide_flatbuffers-*.whl"
          publish_project "halide-wabt-${{ needs.check.outputs.wabt_version }}" "halide_wabt-*.whl"

      - name: Trigger index rebuild
        run: gh workflow run rebuild-index.yml --repo halide/pypi